name: Check UI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/website-foundation]

permissions:
  contents: read

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        working-directory: apps/web
        run: npm install --no-audit --no-fund
      - name: Type check
        working-directory: apps/web
        run: npm run lint
      - name: Build static preview
        working-directory: apps/web
        run: npm run build
